<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Research Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 28px;
      color: #dfdfdf;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 32px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 700px;
      margin-bottom: 32px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #10c888; }

    button {
      padding: 12px 24px;
      background: #18974f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #0da06c; }
    button:disabled { background: #444; cursor: not-allowed; }

    .status {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
      min-height: 20px;
    }

    .results {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 20px 24px;
    }

    .card h2 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #10c863;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 13.5px;
      line-height: 1.75;
      color: #ccc;
      white-space: pre-wrap;
    }

    .download-btn {
  margin-top: 16px;
  padding: 10px 20px;
  background: transparent;
  color: #10c863;
  border: 1px solid #10c863;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.download-btn:hover {
  background: #10c863;
  color: #000;
}
  </style>
</head>
<body>

  <h1>AI Research Agent</h1>
  <p class="subtitle">One of The Fastest AI Research Agents right now!</p>

  <div class="search-bar">
    <input id="queryInput" type="text" placeholder="e.g. latest AI agent frameworks 2026" />
    <button id="searchBtn" onclick="runResearch()">Research</button>
  </div>

  <div class="status" id="status"></div>

  <div class="results" id="results"></div>

 <script>
  let reportData = {};  // declared at top level so both functions can access it

  async function runResearch() {
    const query = document.getElementById("queryInput").value.trim();
    if (!query) return;

    const btn = document.getElementById("searchBtn");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    btn.disabled = true;
    status.textContent = "Searching the web...";
    results.innerHTML = "";

    try {
      await new Promise(r => setTimeout(r, 500));
      status.textContent = "Summarizing results...";

      const response = await fetch("/research", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });

      const data = await response.json();
      status.textContent = "Done!";

      reportData = { query, summary: data.summary, report: data.final_report };  // now correctly after declaration

      results.innerHTML = `
        <div class="card">
          <h2>Summary</h2>
          <p>${data.summary}</p>
        </div>
        <div class="card">
          <h2>Full Report</h2>
          <p>${data.final_report}</p>
          <button class="download-btn" onclick="downloadReport()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-right:6px;">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
  Download Report
</button>
        </div>
      `;

    } catch (err) {
      status.textContent = "Something went wrong. Try again.";
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }

  function downloadReport() {
    const { query, summary, report } = reportData;
    const now = new Date().toISOString().replace('T', ' ').slice(0, 19);
    const content = `# Research Report\n\n**Query:** ${query}\n\n**Generated:** ${now}\n\n---\n\n## Summary\n\n${summary}\n\n---\n\n## Full Report\n\n${report}`;
    const blob = new Blob([content], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `report_${query.slice(0, 30).replace(/\s+/g, '_')}.md`;
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById("queryInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") runResearch();
  });
</script>
</body>
</html>
